# Every alert goes to the alert sink, which stands in for the on-call pager.
route:
  receiver: sink
  group_by: ["alertname"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: sink
    webhook_configs:
      - url: http://alertsink:9095/alertmanager
        send_resolved: true
